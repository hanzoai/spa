# spa — build the base image. Same lane as speech/billing: git.hanzo.ai tag
# push → act_runner (hanzo-build-linux-amd64) → docker build → ghcr.io/hanzoai/spa:<semver>.
#
# Tag-triggered ONLY: the version IS the tag, so one tag is one run is one
# image, and a published tag is never overwritten — two digests behind one
# name is the fleet's oldest trap.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      # ONE IMAGE, BOTH ARCHITECTURES. The lab runs amd64 (evo) and arm64
      # (spark), so an image built for one deploys on half the fleet. The pool
      # is amd64, so the arm64 leg compiles under emulation and binfmt is what
      # lets it run at all; the multi-platform build itself needs the
      # docker-container driver, which the daemon's built-in builder is not.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Version from the tag, refused if already published
        id: v
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "::error::not a v* tag ref: $GITHUB_REF"; exit 1;; esac
          V="${GITHUB_REF#refs/tags/v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          T=$(curl -s "https://ghcr.io/token?scope=repository:hanzoai/spa:pull" | jq -r .token)
          C=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/hanzoai/spa/manifests/$V")
          if [ "$C" = "200" ]; then echo "::error::$V already published — bump the tag"; exit 1; fi

      # Built straight to the registry: a manifest list cannot be loaded into a
      # local daemon, so there is no `docker push` half to forget.
      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            -t "ghcr.io/hanzoai/spa:${{ steps.v.outputs.version }}" --push .
